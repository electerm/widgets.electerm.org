name = "electerm-widgets"
compatibility_date = "2024-12-01"
workers_dev = true

# Pure static site: no Worker script, no database.
# public/ (including _headers, health and 404.html) is generated by npm run build.
[assets]
directory = "./public"
not_found_handling = "404-page"

[[routes]]
pattern = "widgets.electerm.org"
custom_domain = true
